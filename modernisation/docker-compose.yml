name: oscommerce-legacy

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: oscommerce
      MARIADB_USER: osc
      MARIADB_PASSWORD: osc
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: modernisation/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      OSC_DB_SERVER: db
      OSC_DB_USER: osc
      OSC_DB_PASSWORD: osc
      OSC_DB_NAME: oscommerce
      OSC_PUBLIC_URL: "http://localhost:${WEB_PORT:-8080}/"
      OSC_ADMIN_USER: admin
      OSC_ADMIN_PASSWORD: admin123
      OSC_ADMIN_LOGIN_ATTEMPTS: "${OSC_ADMIN_LOGIN_ATTEMPTS:-1000}"
    ports:
      - "${WEB_PORT:-8080}:80"
